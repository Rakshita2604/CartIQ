# Hinglish grocery lexicon, version hinglish-v1. FROZEN: do not edit; add a new version.
#
# Source: hand-curated (manual-v1) common Hindi/Hinglish names, with common romanized
# spellings, for the product types of the synthetic-v1 catalog and the grocery product
# types of the BigBasket catalog (staples, pulses, oils, spices, produce, dairy, eggs,
# bakery, beverages, household). Built from the catalogs, not from evaluation queries
# or system output. The author had seen the 63 development queries, which is why a
# held-out query set is written by someone else after this file is frozen.
#
# Semantics (applied by query understanding):
# - `terms` are what a shopper may type: words or phrases, matched as whole tokens,
#   longest phrase first. A term belongs to exactly one entry.
# - `english` are catalog-language equivalents. They are added alongside the typed term
#   (never replacing it) to form one concept.

schema_version = 1
version = "hinglish-v1"

