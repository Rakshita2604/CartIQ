# CartIQ default configuration.
#
# Precedence (highest first): explicit constructor args > CARTIQ_* environment
# variables > this file > code defaults. Nested keys map to env vars with a
# double underscore, e.g. CARTIQ_API__PORT=9000.
#
# Point CARTIQ_CONFIG_FILE at another TOML file to replace this one.
# Relative paths are resolved against the current working directory.

environment = "dev"
log_level = "INFO"

[paths]
data_dir = "data"
artifacts_dir = "artifacts"

[api]
host = "127.0.0.1"
port = 8000

[ingestion]
# Kaggle "BigBasket Entire Product List" CSV (CC BY-NC-SA 4.0). Download manually; not committed.
bigbasket_csv = "data/raw/bigbasket_products.csv"

[simulation]
seed = 42
n_stores = 5
cities = ["Bengaluru", "Mumbai", "Delhi"]
assortment_ratio = 0.7       # share of the catalog each store carries
out_of_stock_rate = 0.08     # share of carried products with zero stock
max_stock_units = 50
n_users = 500
min_orders_per_user = 1
max_orders_per_user = 12
max_lines_per_order = 8
brand_loyalty = 0.75         # probability a user buys their preferred brand in a category
popularity_exponent = 1.0    # Zipf exponent for global product popularity
history_start = 2026-01-01
history_days = 90
inventory_as_of = 2026-04-01T00:00:00Z

[retrieval.bm25]
# BM25F field weights and length normalization, fixed before evaluation (not tuned).
# weight = 0 removes a field from the index: it affects neither scores, document
# frequencies nor average lengths. The top-level category is excluded on purpose.
k1 = 1.2
name = { weight = 3.0, b = 0.75 }          # leading brand prefix removed
product_type = { weight = 2.0, b = 0.0 }   # last category level
brand = { weight = 1.0, b = 0.0 }
sub_category = { weight = 0.5, b = 0.0 }   # middle category level(s)
description = { weight = 0.3, b = 0.75 }
category = { weight = 0.0, b = 0.0 }       # top level, e.g. "Foodgrains, Oil & Masala"

[query]
# Query understanding (Phase 4). Fixed before evaluation; never tuned on judgments.
lexicon = "hinglish-v1"              # frozen: src/cartiq/query/lexicon/hinglish-v1.toml
brand_aliases = "brand-aliases-v1"   # frozen: src/cartiq/query/lexicon/brand-aliases-v1.toml
one_edit_min_length = 4              # shorter tokens are never spelling-corrected
two_edit_min_length = 8              # two edits allowed from this length
dominance_ratio = 20.0               # known-but-rare token: add a neighbour with df >= 20x ...
dominance_min_df = 5                 # ... and df >= 5
bare_count_max = 50                  # trailing bare integer 2..50 = ambiguous count ("eggs 12")
spelling_fields = ["name", "brand", "product_type"]   # spelling targets (4b: no descriptions)
brand_min_share = 0.5                # one-word brand only if >= 50% of products with the word carry it

[ranking]
candidate_depth = 100                # s6: store-eligible BM25F candidates reordered exact-first
coverage_fields = ["name", "brand", "product_type"]  # s6: fields that make a match exact

[evaluation]
judgments_file = "eval/judgments/synthetic-v1.toml"
k = 10                       # cut-off for NDCG, MRR and Judged
recall_at = [10, 100]        # retrieval depths for whole-catalog Recall@K
hit_min_grade = 2            # lowest grade counted as a hit by MRR and Recall (3 = exact only)
