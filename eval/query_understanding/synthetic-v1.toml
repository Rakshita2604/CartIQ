# Expected query understanding, version qu-expectations-v1.
#
# Written by hand from what each query means, before brand detection or constraint
# ordering exist, and never from parser, retrieval or evaluation output. Development
# queries only: the held-out judgments are not used, and no held-out query word appears
# in a do-not-correct list.
#
# Per case:
# - quantity: kind none | amount (value + unit, optional pack_count) | pack (pack_count)
#   | bare_number (count: an ambiguous count, N pieces or a pack of N).
# - brand: the brand the query names, as spelled in that catalog; "" means no brand.
#   Compared by brand key (tokens joined, case-insensitive).
# - corrections: every spelling correction expected (typed -> intended word).
#
# Scoring reports two measurements separately, so a correct correction can never hide a
# harmful extra one:
# 1. Expected correction coverage: for each expected correction, is the intended word
#    among the terms the parser gives that typed token (the correction itself or its
#    lexicon/plural expansions)?
# 2. Unexpected corrections: every correction candidate the parser produces that is not
#    an expected one (other typed tokens, or extra/different targets for an expected
#    token), counted and listed explicitly, including in cases whose expected
#    correction is covered.
# Per suite:
# - do_not_correct: valid words that must not receive any spelling correction.
# - never_produce: terms that must not appear in any concept for any case or for any
#   development query text run against that catalog.

schema_version = 1
version = "qu-expectations-v1"
labeler = "manual-v1"

[[suite]]
name = "synthetic-dev"
catalog = "synthetic-v1"
catalog_sha256 = "d22b5de53fd9abca6164dafebfdff8bb4270d73442da1f5b8030d170a664dc38"
# All 63 development queries, in development-file order.
do_not_correct = ["amul", "chicken", "colgate", "dahi", "dettol", "fortune", "garam", "iphone", "kela", "laptop", "maggi", "masala", "nescafe", "onion", "pizza", "rajma", "soap", "surf", "vodka"]
never_produce = []

